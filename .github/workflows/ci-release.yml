name: CI Build & Publish (Linux + macOS + Windows)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # -------------------------
  # Linux wheels: manylinux
  # -------------------------
  build-linux-manylinux-2-28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build wheels (manylinux_2_28_x86_64)
        run: |
          chmod +x scripts/build_docker_manylinux.sh
          bash ./scripts/build_docker_manylinux.sh manylinux_2_28_x86_64
          ls -lh dist

      - name: Upload wheels artifact (manylinux_2_28)
        uses: actions/upload-artifact@v4
        with:
          name: dist-manylinux_2_28
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build-linux-manylinux-2-34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build wheels (manylinux_2_34_x86_64)
        run: |
          chmod +x scripts/build_docker_manylinux.sh
          bash ./scripts/build_docker_manylinux.sh manylinux_2_34_x86_64
          ls -lh dist

      - name: Upload wheels artifact (manylinux_2_34)
        uses: actions/upload-artifact@v4
        with:
          name: dist-manylinux_2_34
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # -------------------------
  # macOS wheels
  # -------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Homebrew cache
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/Library/Caches/Homebrew
            /opt/homebrew/Cellar/gcc
            /usr/local/Cellar/gcc
          key: ${{ runner.os }}-${{ runner.arch }}-homebrew-gcc-15
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-homebrew-gcc-

      - name: Install gfortran
        shell: bash
        run: |
          set -euxo pipefail

          brew update
          brew install gcc

          if [ -x "$(brew --prefix)/bin/gfortran-15" ]; then
            GFORTRAN="$(brew --prefix)/bin/gfortran-15"
          elif [ -x "$(brew --prefix gcc)/bin/gfortran-15" ]; then
            GFORTRAN="$(brew --prefix gcc)/bin/gfortran-15"
          elif command -v gfortran >/dev/null 2>&1; then
            GFORTRAN="$(command -v gfortran)"
          else
            echo "gfortran not found"
            ls -l "$(brew --prefix)/bin"/gfortran* || true
            ls -l "$(brew --prefix gcc)/bin"/gfortran* || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$GFORTRAN" "$RUNNER_TEMP/bin/gfortran"

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "FC=$GFORTRAN" >> "$GITHUB_ENV"
          echo "F77=$GFORTRAN" >> "$GITHUB_ENV"
          echo "F90=$GFORTRAN" >> "$GITHUB_ENV"

          "$GFORTRAN" --version

      - name: Build wheels (macOS)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        shell: bash
        run: |
          set -euxo pipefail

          echo "FC=$FC"
          command -v gfortran
          gfortran --version
          "$FC" --version

          chmod +x scripts/topbuild_manywheel_macos_uv.sh scripts/build_wheel_macos.sh
          bash ./scripts/topbuild_manywheel_macos_uv.sh
          ls -lh dist

      - name: Upload wheels artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # -------------------------
  # Windows wheels
  # -------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache Intel oneAPI installation
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Intel\oneAPI
          key: oneapi-hpc-2025.3.1.54-installed

      - name: Cache oneAPI offline installer
        uses: actions/cache@v4
        with:
          path: intel-oneapi-hpc-toolkit-2025.3.1.54_offline.exe
          key: oneapi-hpc-2025.3.1.54-offline

      - name: Download oneAPI HPC Toolkit (offline)
        shell: pwsh
        run: |
          $exe = "intel-oneapi-hpc-toolkit-2025.3.1.54_offline.exe"
          if (-not (Test-Path $exe)) {
            curl.exe -L `
              "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/36f868e9-84b3-4b4f-90ef-ca84092cae6a/intel-oneapi-hpc-toolkit-2025.3.1.54_offline.exe" `
              --output $exe
          }

      - name: Install oneAPI HPC Toolkit
        shell: pwsh
        run: |
          $exe = "intel-oneapi-hpc-toolkit-2025.3.1.54_offline.exe"
          $setvars = "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"

          if (Test-Path $setvars) {
            Write-Host "oneAPI already installed, skip install."
            exit 0
          }

          $components = @(
            "intel.oneapi.win.mpi.devel:intel.oneapi.win.ifort-compiler"
          )

          $args = @(
            "-s","-a","--silent","--eula","accept",
            "-p=NEED_VS2022_INTEGRATION=0",
            "--components"
          ) + $components

          Start-Process -FilePath ".\${exe}" -ArgumentList $args -Wait -NoNewWindow

          if (-not (Test-Path $setvars)) {
            throw "oneAPI setvars.bat not found. Install may have failed."
          }

      - name: Build wheels
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          ifx /QV
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\topbuild_manywheel_windows_uv.ps1

      - name: Upload wheels artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # -------------------------
  # sdist
  # -------------------------
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          chmod +x scripts/build_docker_sdist.sh
          bash ./scripts/build_docker_sdist.sh
          ls -lh dist

      - name: Test sdist import
        run: |
          python -m pip install dist/*.tar.gz
          python -c "import easyclimate_backend; from easyclimate_backend.pyspharm import spharm; from easyclimate_backend.wrf import extension, constants; print(easyclimate_backend.__version__); print(spharm.__version__); print(extension.__name__); print(constants.__name__)"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # -------------------------
  # Linux manylinux tests
  # -------------------------
  test-linux-manylinux-2-28:
    runs-on: ubuntu-latest
    needs: build-linux-manylinux-2-28
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Download wheels artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-manylinux_2_28
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test wheel import
        shell: bash
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          set -euxo pipefail
          PY_TAG="cp${PY_VERSION//./}"
          wheel="$(find wheelhouse -maxdepth 1 -name "*${PY_TAG}*.whl" | head -n 1)"
          if [ -z "${wheel}" ]; then
            echo "No wheel found for Python ${PY_TAG}"
            find wheelhouse -maxdepth 1 -name '*.whl' -print
            exit 1
          fi
          python -m pip install "${wheel}"
          python - <<'PY'
          import easyclimate_backend
          import easyclimate_backend.wrf as wrf
          from easyclimate_backend.pyspharm import spharm
          from easyclimate_backend.wrf import extension, constants

          print("easyclimate_backend:", easyclimate_backend.__version__)
          print("easyclimate_backend.wrf:", wrf.__name__)
          print("easyclimate_backend.pyspharm:", spharm.__version__)
          print("easyclimate_backend.wrf.extension:", extension.__name__)
          print("easyclimate_backend.wrf.constants:", constants.__name__)
          PY

  test-linux-manylinux-2-34:
    runs-on: ubuntu-latest
    needs: build-linux-manylinux-2-34
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Download wheels artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-manylinux_2_34
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test wheel import
        shell: bash
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          set -euxo pipefail
          PY_TAG="cp${PY_VERSION//./}"
          wheel="$(find wheelhouse -maxdepth 1 -name "*${PY_TAG}*.whl" | head -n 1)"
          if [ -z "${wheel}" ]; then
            echo "No wheel found for Python ${PY_TAG}"
            find wheelhouse -maxdepth 1 -name '*.whl' -print
            exit 1
          fi
          python -m pip install "${wheel}"
          python - <<'PY'
          import easyclimate_backend
          import easyclimate_backend.wrf as wrf
          from easyclimate_backend.pyspharm import spharm
          from easyclimate_backend.wrf import extension, constants

          print("easyclimate_backend:", easyclimate_backend.__version__)
          print("easyclimate_backend.wrf:", wrf.__name__)
          print("easyclimate_backend.pyspharm:", spharm.__version__)
          print("easyclimate_backend.wrf.extension:", extension.__name__)
          print("easyclimate_backend.wrf.constants:", constants.__name__)
          PY

  # -------------------------
  # macOS tests
  # -------------------------
  test-macos:
    runs-on: macos-latest
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Download wheels artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test wheel import
        shell: bash
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          set -euxo pipefail
          PY_TAG="cp${PY_VERSION//./}"
          wheel="$(find wheelhouse -maxdepth 1 -name "*${PY_TAG}*.whl" | head -n 1)"
          if [ -z "${wheel}" ]; then
            echo "No wheel found for Python ${PY_TAG}"
            find wheelhouse -maxdepth 1 -name '*.whl' -print
            exit 1
          fi
          python -m pip install "${wheel}"
          python - <<'PY'
          import easyclimate_backend
          import easyclimate_backend.wrf as wrf
          from easyclimate_backend.pyspharm import spharm
          from easyclimate_backend.wrf import extension, constants

          print("easyclimate_backend:", easyclimate_backend.__version__)
          print("easyclimate_backend.wrf:", wrf.__name__)
          print("easyclimate_backend.pyspharm:", spharm.__version__)
          print("easyclimate_backend.wrf.extension:", extension.__name__)
          print("easyclimate_backend.wrf.constants:", constants.__name__)
          PY

  # -------------------------
  # Windows tests
  # -------------------------
  test-windows:
    runs-on: windows-latest
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Download wheels artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test wheel import
        shell: pwsh
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          $pyTag = "cp" + ($env:PY_VERSION -replace '\.', '')
          $wheel = Get-ChildItem -Path wheelhouse -Filter "*$pyTag*.whl" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $wheel) {
            Write-Host "No wheel found for Python $pyTag"
            Get-ChildItem -Path wheelhouse -Filter *.whl | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          python -m pip install $wheel.FullName
          python -c "import easyclimate_backend; import easyclimate_backend.wrf as wrf; from easyclimate_backend.pyspharm import spharm; from easyclimate_backend.wrf import extension, constants; print(easyclimate_backend.__version__); print(wrf.__name__); print(spharm.__version__); print(extension.__name__); print(constants.__name__)"

  # -------------------------
  # Publish once
  # -------------------------
  publish:
    runs-on: ubuntu-latest
    needs:
      - test-linux-manylinux-2-28
      - test-linux-manylinux-2-34
      - test-macos
      - test-windows
      - build-sdist

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show dist
        run: |
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-all
          path: dist/
